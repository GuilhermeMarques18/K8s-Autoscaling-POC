apiVersion: apps/v1          
kind: Deployment
metadata:
  name: orders                
  labels:
    app: orders                
spec:
  replicas: 1              
  selector:
    matchLabels:
      app: orders              
  template:                     
    metadata:
      labels:
        app: orders               
    spec:
      containers:
        - name: orders
          image: guilhermemarques18/orders:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: GRPC_ADDR
              value: ":8080"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"