services:
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    container_name: orders
    ports:
      - "8080:8080" 
      - "8081:8081"  
    environment:
      - HTTP_ADDR=:8081
      - GRPC_ADDR=:8080
    networks:
      - poc-net
    restart: unless-stopped

  kitchen:
    build:
      context: .
      dockerfile: services/kitchen/Dockerfile
    container_name: kitchen
    ports:
      - "9000:9000"
    environment:
      - HTTP_ADDR=:9000
      - ORDERS_GRPC_ADDR=orders:8080
    depends_on:
      - orders
    networks:
      - poc-net
    restart: unless-stopped

networks:
  poc-net:
    driver: bridge